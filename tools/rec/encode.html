<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сборка видео</title>
<style>body { margin: 0; background: #111; color: #ddd; font: 14px sans-serif; } canvas { display: none; }</style>
<!-- Часы страницы под нашим управлением: музыка и звуки игры «играют» в OfflineAudioContext
     по журналу событий записи, ровно в те же моменты, что и в кадрах -->
<script src="timemachine.js"></script>
<script>
    window.FB = { S: { settings: { sound: true, music: true, musicVol: 70, soundVol: 85, lang: 'ru' } }, emit() {}, on() {}, lang: 'ru' };
</script>
<script src="../../js/core/util.js"></script>
<script src="../../js/core/audio.js"></script>
<script src="../../js/core/music.js"></script>
<script src="mp4.js"></script>
</head>
<body>
<!-- tools/rec/encode.html?film=имя — собирает tools/rec/out/<имя>/<имя>.mp4 (запускает tools/rec/encode.js) -->
<div id="log">готовлюсь…</div>
<canvas id="cv"></canvas>
<script>
const q = new URLSearchParams(location.search);
const film = q.get('film');
const base = '/rec/' + film + '/';
const log = (s) => { document.getElementById('log').textContent = s; window.__progress = s; };
window.__progress = 'start';

async function soundtrack(man) {
    const SR = 48000, fps = man.fps;
    const dur = man.frames / fps;
    const len = Math.ceil(dur * SR);
    // Офлайн-контекст: «текущее время» — это часы страницы, которыми управляем мы
    class RecCtx extends OfflineAudioContext {
        constructor() {
            super(2, len, SR);
            this._mix = this.createGain();
            this._mix.connect(super.destination);
        }
        get destination() { return this._mix; }
        get currentTime() { return performance.now() / 1000; }
    }
    const rc = new RecCtx();
    window.AudioContext = function () { return rc; };
    window.webkitAudioContext = window.AudioContext;
    // Мягкое начало и конец дорожки
    const g = rc._mix.gain;
    g.setValueAtTime(0, 0);
    g.linearRampToValueAtTime(1, 0.25);
    g.setValueAtTime(1, Math.max(0.3, dur - (man.fadeOut || 1.0)));
    g.linearRampToValueAtTime(0, dur);
    const byFrame = new Map();
    for (const e of man.events) { if (!byFrame.has(e.f)) byFrame.set(e.f, []); byFrame.get(e.f).push(e); }
    if (man.music && man.music.scene) FB.audio.setScene(man.music.scene[0], man.music.scene[1]);
    FB.audio.unlock();
    for (let f = 0; f < man.frames; f++) {
        for (const e of byFrame.get(f) || []) {
            if (e.fn === 'mark') continue;
            if (man.music && man.music.lockScene && e.fn === 'setScene') continue;
            try { FB.audio[e.fn] && FB.audio[e.fn](...e.args); } catch (err) { console.error(err); }
        }
        await window.__tm.step(1000 / fps, false);
        if (f % 60 === 0) log('звук: ' + f + ' / ' + man.frames);
    }
    log('звук: рендер…');
    return rc.startRendering();
}

async function encodeAudio(buf) {
    const chunks = [];
    let desc = null;
    const ae = new AudioEncoder({
        output: (c, meta) => {
            if (meta && meta.decoderConfig && meta.decoderConfig.description) desc = meta.decoderConfig.description;
            const d = new Uint8Array(c.byteLength); c.copyTo(d); chunks.push(d);
        },
        error: (e) => { throw e; }
    });
    ae.configure({ codec: 'mp4a.40.2', sampleRate: buf.sampleRate, numberOfChannels: 2, bitrate: 192000 });
    const N = buf.length, step = 4800;
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    for (let i = 0; i < N; i += step) {
        const n = Math.min(step, N - i);
        const data = new Float32Array(n * 2);
        data.set(L.subarray(i, i + n), 0);
        data.set(R.subarray(i, i + n), n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: buf.sampleRate, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / buf.sampleRate * 1e6), data });
        ae.encode(ad);
        ad.close();
    }
    await ae.flush();
    ae.close();
    // Если кодер не отдал описание — собираем сами: AAC-LC, 48 кГц, стерео
    if (!desc) desc = new Uint8Array([0x11, 0x90]).buffer;
    return { chunks, desc };
}

async function main() {
    const man = await (await fetch(base + 'manifest.json')).json();
    const W = man.width, H = man.height, fps = man.fps;
    // ---------- Звук ----------
    const buf = await soundtrack(man);
    // Громкость: без перегруза, пик около -1 дБ
    let peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i += 3) peak = Math.max(peak, Math.abs(d[i])); }
    const gain = peak > 0 ? Math.min(2.2, 0.89 / peak) : 1;
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= gain; }
    window.__audioPeak = { peak, gain };
    const audio = await encodeAudio(buf);
    log('звук готов: ' + audio.chunks.length + ' кадров AAC');

    // ---------- Видео ----------
    const cv = document.getElementById('cv');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const vchunks = [];
    let vdesc = null;
    const ve = new VideoEncoder({
        output: (c, meta) => {
            if (meta && meta.decoderConfig && meta.decoderConfig.description) vdesc = meta.decoderConfig.description;
            const d = new Uint8Array(c.byteLength); c.copyTo(d);
            vchunks.push({ d, key: c.type === 'key', ts: c.timestamp });
        },
        error: (e) => { throw e; }
    });
    const big = W * H > 1280 * 720;
    ve.configure({ codec: big ? 'avc1.640028' : 'avc1.64001f', width: W, height: H, bitrate: man.bitrate || (big ? 12e6 : 6e6), framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' });

    const url = (f) => base + 'frames/' + String(f).padStart(5, '0') + '.jpg';
    const cache = new Map();
    const want = (f) => { if (f < man.frames && !cache.has(f)) cache.set(f, fetch(url(f)).then(r => r.blob()).then(b => createImageBitmap(b))); };
    const sceneOf = (f) => man.scenes.find(s => f >= s.start && f < s.end);
    let prevLast = null;
    for (let f = 0; f < man.frames; f++) {
        for (let k = 0; k < 12; k++) want(f + k);
        const img = await cache.get(f);
        cache.delete(f);
        ctx.globalAlpha = 1;
        ctx.drawImage(img, 0, 0, W, H);
        // Переходы между сценами
        const sc = sceneOf(f);
        if (sc && f - sc.start < 10 && sc.start > 0) {
            const k = (f - sc.start) / 10;
            if (sc.transition === 'fade' && prevLast) { ctx.globalAlpha = 1 - k; ctx.drawImage(prevLast, 0, 0, W, H); ctx.globalAlpha = 1; }
            if (sc.transition === 'flash') { ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * (1 - k)) + ')'; ctx.fillRect(0, 0, W, H); }
        }
        if (sc && f === sc.end - 1) { if (prevLast) prevLast.close(); prevLast = img; } else img.close();
        const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
        ve.encode(vf, { keyFrame: f % (fps * 2) === 0 });
        vf.close();
        while (ve.encodeQueueSize > 6) await window.__tm.realWait(4);
        if (f % 30 === 0) log('видео: ' + f + ' / ' + man.frames);
    }
    await ve.flush();
    ve.close();
    log('упаковываю…');
    const mux = new MP4Muxer({ width: W, height: H, fps, videoDesc: vdesc, sampleRate: 48000, channels: 2, audioDesc: audio.desc, audioBitrate: 192000 });
    vchunks.forEach(c => mux.addVideo(c.d, c.key, c.ts));
    audio.chunks.forEach(c => mux.addAudio(c));
    window.__result = mux.finish();
    window.__info = { sizes: vchunks.filter((c, i) => i % 15 === 0).map(c => (c.key ? 'K' : '') + c.d.length), ts: vchunks.slice(0, 6).map(c => c.ts), size: window.__result.size, frames: vchunks.length, aac: audio.chunks.length, peak: window.__audioPeak, reordered: vchunks.some((c, i) => i && c.ts < vchunks[i - 1].ts) };
    log('готово: ' + (window.__result.size / 1e6).toFixed(1) + ' МБ');
    window.__done = true;
}
main().catch(e => { console.error(e); window.__error = String(e && e.stack || e); log('ошибка: ' + e); });
</script>
</body>
</html>
