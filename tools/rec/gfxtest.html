<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стенд графики роликов</title>
<link rel="stylesheet" href="../../css/style.css">
<style>html, body { margin: 0; background: #111; overflow: hidden; } .g { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 4px; padding: 4px; } canvas { width: 100%; display: block; }</style>
<script>window.FB = { lang: 'ru', t: (k) => k };</script>
<script src="../../js/core/util.js"></script>
<script src="../../js/data/fish.js"></script>
<script src="../../js/data/gear.js"></script>
<script src="../../js/view/fishart.js"></script>
<script src="gfx.js"></script>
</head>
<body>
<!-- Стенд графики: ?bg=/rec/src-h/frames/00720.jpg&w=1920&h=1080&cols=4 — каждая штука из gfx.js в нескольких фазах -->
<div class="g" id="g"></div>
<script>
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080);
document.body.style.setProperty('--cols', q.get('cols') || 4);
const items = [
    ['word', { text: 'ЛОВИ!', size: 0.22, y: 0.42, dur: 1.1 }, [0.15, 0.6]],
    ['word', { text: 'СОБИРАЙ!', size: 0.22, y: 0.42, dur: 1.6, top: '#e6fbff', bot: '#3fb0ff', stroke: '#0d2a52' }, [0.7]],
    ['logo', { size: 0.17, y: 0.4, dur: 2.2, sub: 'рыбалка, о которой хочется рассказать', subY: 1.25 }, [0.5, 1.4]],
    ['bubble', { text: 'Поймал я как-то сома…', x: 0.5, y: 0.36, size: 0.05, dur: 1.1, typing: 0.75 }, [0.9]],
    ['ruler', { y: 0.72, w: 0.78, dur: 1.2, text: '3 МЕТРА!', size: 0.1 }, [0.8]],
    ['tag', { fish: 'goldcarp', name: 'Золотой карп', rarity: 'legendary', weight: 12.4, extra: 'рекорд!', y: 0.8, size: 0.13, dur: 1.9 }, [1.2]],
    ['fishgrid', { ids: ['crucian', 'perch', 'pike', 'goldcarp', 'trout', 'salmon', 'taimen', 'catfish', 'spirit', 'eel', 'tuna', 'stingray'], unknown: ['salmon', 'taimen'], cols: 6, w: 0.72, y: 0.55, title: '44 рыбы', titleSize: 0.09, dur: 1.7 }, [1.2]],
    ['counter', { value: 86, suffix: ' КГ!', size: 0.2, y: 0.36, dur: 1.6, count: 0.5 }, [0.9]],
    ['prompt', { hold: true, x: 0.5, y: 0.24, size: 0.1, dur: 9 }, [0.3]],
    ['pop', { text: 'Клюёт!', x: 0.6, y: 0.33, size: 0.08, dur: 0.8, bot: '#ff8a3a' }, [0.3]],
    ['cta', { dur: 2.8, logoY: 0.34, logoSize: 0.17, btnY: 0.72, btnSize: 0.06, tapEvery: 1.2, sub: 'Расскажи свою байку!', subY: 0.88 }, [1.5]],
    ['speedlines', { x: 0.5, y: 0.45, dur: 2 }, [0.6]]
];
(async () => {
    await document.fonts.load('900 64px Nunito', 'Рыбацкие БАЙКИ ЛОВИ!');
    const bg = q.get('bg') ? await createImageBitmap(await (await fetch(q.get('bg'))).blob()) : null;
    const g = document.getElementById('g');
    for (const [type, opt, times] of items) {
        for (const t of times) {
            const c = document.createElement('canvas'); c.width = W; c.height = H;
            const x = c.getContext('2d');
            if (bg) x.drawImage(bg, 0, 0, W, H); else { x.fillStyle = '#4a7ab0'; x.fillRect(0, 0, W, H); }
            if (type === 'cta') { x.filter = 'blur(14px)'; if (bg) x.drawImage(bg, 0, 0, W, H); x.filter = 'none'; x.fillStyle = 'rgba(8,12,30,0.45)'; x.fillRect(0, 0, W, H); }
            try { GFX[type](x, opt, t, W, H); } catch (e) { x.fillStyle = 'red'; x.font = '40px sans-serif'; x.fillText(type + ': ' + e.message, 20, 60); }
            g.appendChild(c);
        }
    }
    window.__ready = true;
})();
</script>
</body>
</html>
