<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Галерея рыб</title>
<style>
    body { margin: 0; background: #cfeefa; font: 13px sans-serif; color: #20384a; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; }
    .cell { background: #fff8ec; border-radius: 14px; padding: 6px; text-align: center; width: 190px; }
    .cell img { display: block; margin: 0 auto; }
    h2 { margin: 12px; }
</style>
</head>
<body>
<h2>Рыбы и мусор — проверка рисунков</h2>
<div class="grid" id="g"></div>
<script>window.FB = { lang: 'ru', t: (k) => k };</script>
<script src="../../js/core/util.js"></script>
<script src="../../js/data/fish.js"></script>
<script src="../../js/view/fishart.js"></script>
<script>
    const g = document.getElementById('g');
    const add = (id, label, opts) => {
        const d = document.createElement('div');
        d.className = 'cell';
        d.innerHTML = '<img src="' + FB.fishArt.url(id, 120, opts) + '"><div>' + label + '</div>';
        g.appendChild(d);
    };
    FB.FISH.forEach(f => add(f.id, f.n.ru + ' · ' + f.r + ' · ' + f.art.shape));
    FB.JUNK.forEach(j => add(j.id, j.n.ru));
    add('carp', 'силуэт', { silhouette: true });
</script>
</body>
</html>
